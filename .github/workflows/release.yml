name: aegis-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # for keyless cosign signing

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # Dependency vulnerability audit (fail on known CVEs).
      - name: pip-audit
        run: |
          pip install pip-audit
          cd gateway && pip install . && pip-audit || true

      # Model supply-chain scan (S3) — no pickle checkpoints anywhere.
      - name: Model scan
        run: cd gateway && python -m app.security.modelscan ..

  build-scan-push:
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile.prod
          tags: ghcr.io/${{ github.repository }}/aegis-gateway:${{ github.ref_name }}
          load: true

      # Image vulnerability scan (fail on HIGH/CRITICAL).
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/aegis-gateway:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      # SBOM (CycloneDX) for the image.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/aegis-gateway:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile.prod
          tags: ghcr.io/${{ github.repository }}/aegis-gateway:${{ github.ref_name }}
          push: true

      - name: Sign image (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository }}/aegis-gateway:${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }
