image:
  repository: ghcr.io/example/aegis-gateway
  tag: prod
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests: { cpu: 500m, memory: 512Mi }
  limits: { cpu: "2", memory: 2Gi }

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

# Non-secret config -> ConfigMap.
config:
  AEGIS_OFFLINE: "0"
  AEGIS_DEFAULT_FAIL_MODE: "closed"
  AEGIS_CORS_ORIGINS: "https://aegis.example.com"
  AEGIS_JUDGE_BUDGET_PER_MIN: "30"
  AEGIS_RATE_LIMIT_PER_MIN: "120"
  AEGIS_RESPONSE_FLOOR_MS: "8"
  AEGIS_RESPONSE_JITTER_MS: "4"
  AEGIS_REDIS_URL: "redis://aegis-redis-master:6379/0"
  AEGIS_BOOTSTRAP: "0"
  AEGIS_WORKERS: "2"

# Secrets: reference an existing Secret managed by Vault/ExternalSecrets.
existingSecret: aegis-secrets

service:
  port: 80

ingress:
  enabled: true
  className: nginx
  host: aegis.example.com
  tlsSecret: aegis-tls
  clusterIssuer: letsencrypt-prod

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceMonitor:
  enabled: true

# Bundled dependencies (enable if you don't bring your own).
postgresql:
  enabled: false
redis:
  enabled: false
