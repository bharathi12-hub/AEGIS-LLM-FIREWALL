# Deploy everything:  kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegis
resources:
  - namespace.yaml
  - config.yaml
  - deployment.yaml
  - service-hpa-pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - observability.yaml
  - retention-cronjob.yaml
images:
  - name: ghcr.io/example/aegis-gateway
    newTag: prod
commonLabels:
  app.kubernetes.io/part-of: aegis
