apiVersion: v1
kind: Service
metadata:
  name: aegis-gateway
  namespace: aegis
  labels: { app.kubernetes.io/name: aegis }
spec:
  selector: { app.kubernetes.io/name: aegis, app.kubernetes.io/component: gateway }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis-gateway
  namespace: aegis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegis-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aegis-gateway
  namespace: aegis
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: aegis, app.kubernetes.io/component: gateway }
