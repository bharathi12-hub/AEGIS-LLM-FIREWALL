# Production-style compose (single host): real Postgres + Redis, DB migration,
# multiple gateway replicas behind an nginx TLS reverse proxy.
#
#   cd deploy && cp .env.prod.example .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build --scale gateway=3
name: aegis-prod
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: aegis
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build: { context: ../gateway, dockerfile: Dockerfile.prod, args: { INSTALL_DB: "true" } }
    command: ["alembic", "upgrade", "head"]
    environment:
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  gateway:
    build: { context: ../gateway, dockerfile: Dockerfile.prod, args: { INSTALL_DB: "true" } }
    environment:
      AEGIS_OFFLINE: "0"
      AEGIS_DEFAULT_FAIL_MODE: closed
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
      AEGIS_REDIS_URL: redis://redis:6379/0
      AEGIS_ADMIN_API_KEY: ${AEGIS_ADMIN_API_KEY:?set AEGIS_ADMIN_API_KEY}
      AEGIS_AUDIT_KEY: ${AEGIS_AUDIT_KEY:?set AEGIS_AUDIT_KEY}
      AEGIS_KEY_PEPPER: ${AEGIS_KEY_PEPPER:?set AEGIS_KEY_PEPPER}
      AEGIS_CORS_ORIGINS: ${AEGIS_CORS_ORIGINS:-https://aegis.example.com}
      AEGIS_BOOTSTRAP: "0"
      AEGIS_WORKERS: "2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    expose: ["8080"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/aegis.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports: ["443:443", "80:80"]
    depends_on: [gateway]

volumes:
  pgdata: {}
